[package]
name = "comiccraft-clip"
version = "0.1.0"
edition = "2021"
authors = ["ArtCraft Contributors"]
description = "Clip Studio Paint (.clip) file format reader and writer for ComicCraft"

[dependencies]
comiccraft-core = { path = "../comiccraft-core" }
byteorder = "1.5"
flate2 = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
