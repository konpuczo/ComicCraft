[package]
name = "comiccraft-cli"
version = "0.1.0"
edition = "2021"
authors = ["ArtCraft Contributors"]
description = "Command-line tool and MCP agent server for ComicCraft (ArtCraft Clip Studio Paint recreation)"

[[bin]]
name = "comiccraft-cli"
path = "src/main.rs"

[dependencies]
comiccraft-core = { path = "../comiccraft-core" }
comiccraft-clip = { path = "../comiccraft-clip" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
