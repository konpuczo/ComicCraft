[workspace]
members = [
    "crates/comiccraft-core",
    "crates/comiccraft-clip",
    "crates/comiccraft-cli",
    "crates/comiccraft-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Learning Machines LLC", "ArtCraft Contributors"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"


